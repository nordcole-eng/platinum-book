<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FourFold Homeopathy</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  /* Palette sampled from the cover of "The Fourfold Path to Healing" (Cowan):
     parchment ground, forest-green band, violet spine, painterly earth tones. */
  --bg: #f3ece0; --surface: #fbf7ef; --surface2: #ece3d4;
  --border: #ddd0b9; --text: #2c2722; --text2: #6d6357;
  --accent: #3f6b50; --accent2: #2c4f3a; --accent-bg: rgba(63,107,80,.08);
  --green: #4a7c59; --amber: #9a6714; --teal: #4a6f8a; --rose: #a8443f;
  --plum: #6f5a91;
  --on-accent: #fdfaf4;
  --green-bg: rgba(74,124,89,.10); --green-bg2: rgba(74,124,89,.18);
  --amber-bg: rgba(154,103,20,.08); --teal-bg: rgba(74,111,138,.12);
  --teal-bg-soft: rgba(74,111,138,.07);
  --hl-bg: rgba(214,168,60,.42);
  --shadow: 0 1px 2px rgba(74,58,32,.06);
  --shadow-lg: -4px 0 40px rgba(74,58,32,.22);
  --shadow-green: 0 4px 20px rgba(63,107,80,.32);
  --shadow-green-hover: 0 6px 24px rgba(63,107,80,.42);
  --overlay: rgba(52,42,28,.42);
  --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
}
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.app { display: flex; height: 100vh; }

/* --- Sidebar --- */
.sidebar {
  width: 280px; min-width: 280px; background: var(--surface);
  border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;
}
/* Green band across the top, echoing the cover */
.sidebar-header {
  padding: 18px 20px; border-bottom: 1px solid var(--border); cursor: pointer;
  background: var(--accent); color: var(--on-accent); transition: background .15s;
}
.sidebar-header:hover { background: var(--accent2); }
.sidebar-header h1 {
  font-family: var(--serif); font-size: 19px; font-weight: 600;
  letter-spacing: .2px; margin-bottom: 3px;
}
.sidebar-header p { font-size: 11px; color: rgba(253,250,244,.75); font-style: italic; }

.letter-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px 14px; }
.letter-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
  border-radius: 6px; padding: 5px 0; text-align: center; cursor: pointer;
  font-size: 12px; font-weight: 600; transition: all .15s;
}
.letter-btn:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.letter-btn.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.letter-btn.empty { opacity: .3; pointer-events: none; }

.nav-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 14px; }
.nav-tab {
  padding: 9px 10px; font-size: 11px; font-weight: 600; color: var(--text2);
  cursor: pointer; border-bottom: 2px solid transparent; text-transform: uppercase;
  letter-spacing: .5px; transition: all .15s;
}
.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--accent2); border-bottom-color: var(--accent); }

.sidebar-list { flex: 1; overflow-y: auto; padding: 6px; }
.sidebar-item {
  padding: 8px 10px; border-radius: 6px; cursor: pointer;
  font-size: 12px; margin-bottom: 1px; transition: background .1s;
  display: flex; justify-content: space-between; align-items: center;
}
.sidebar-item:hover { background: var(--surface2); }
.sidebar-item.active { background: var(--accent-bg); color: var(--accent2); }
.sidebar-item .tag { color: var(--text2); font-size: 10px; flex-shrink: 0; margin-left: 8px; }

/* --- Main --- */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.search-bar {
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  display: flex; gap: 12px; align-items: center;
}
.search-wrap { flex: 1; position: relative; }
.search-input {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 16px 10px 38px; color: var(--text);
  font-size: 14px; outline: none; transition: border .15s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text2); }
.search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text2); font-size: 14px; pointer-events: none;
}
.search-clear {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: var(--surface2); border: none; color: var(--text2); cursor: pointer;
  width: 20px; height: 20px; border-radius: 50%; font-size: 12px;
  display: none; align-items: center; justify-content: center;
}
.search-clear.show { display: flex; }
.result-count { font-size: 12px; color: var(--text2); white-space: nowrap; }

.chips-bar {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 0 24px 12px;
  border-bottom: 1px solid var(--border);
}
.chips-bar:empty { display: none; }
.chip {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
  cursor: pointer; border: 1px solid var(--border); transition: all .15s;
  background: var(--accent); color: var(--on-accent); border-color: var(--accent);
}
.chip.off {
  background: var(--surface2); color: var(--text2); border-color: var(--border);
}
.chip .chip-x {
  font-size: 14px; line-height: 1; opacity: .7; margin-left: 2px;
}
.chip:hover .chip-x { opacity: 1; }

.symptom-group { margin-bottom: 32px; }
.symptom-group-label {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  padding-bottom: 8px; border-bottom: 2px solid var(--accent);
}
.symptom-chip-inline {
  background: var(--accent); color: var(--on-accent); border-radius: 20px;
  padding: 4px 14px; font-size: 13px; font-weight: 700;
}
/* Term still being typed — outlined until committed with Enter */
.symptom-chip-inline.draft {
  background: transparent; color: var(--accent2);
  border: 1px dashed var(--accent); padding: 3px 13px;
}

.home-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
  border-radius: 8px; width: 38px; height: 38px; font-size: 18px; cursor: pointer;
  display: none; align-items: center; justify-content: center; flex-shrink: 0;
  transition: all .15s;
}
.home-btn:hover { border-color: var(--accent); color: var(--accent2); }
.home-btn.show { display: flex; }

.content { flex: 1; overflow-y: auto; padding: 24px; }
.content-inner { max-width: 920px; margin: 0 auto; }

/* --- Home Page --- */
.home { padding: 40px 0; }
.home-hero { text-align: center; margin-bottom: 40px; }
.home-hero h2 {
  font-family: var(--serif); font-size: 34px; font-weight: 600;
  letter-spacing: .2px; margin-bottom: 10px; color: var(--accent2);
}
.home-hero p { color: var(--text2); font-size: 15px; max-width: 520px; margin: 0 auto; line-height: 1.6; }
/* Rule under the hero, as on a title page */
.home-hero::after {
  content: ''; display: block; width: 64px; height: 2px;
  background: var(--accent); opacity: .5; margin: 18px auto 0;
}

/* --- Courses --- */
.collapse-toggle {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  user-select: none; transition: color .15s;
}
.collapse-toggle:hover { color: var(--accent2); }
.collapse-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.collapse-arrow { font-size: 9px; transition: transform .2s; display: inline-block; }
.collapse-toggle.open .collapse-arrow { transform: rotate(90deg); }
.collapse-hint { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: .7; }

.course-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px;
}
/* display:grid above would otherwise beat the UA stylesheet's [hidden] rule */
.course-grid[hidden] { display: none; }
.course-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; cursor: pointer; box-shadow: var(--shadow);
  transition: border-color .15s, transform .15s;
}
.course-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.course-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.course-code {
  background: var(--accent); color: var(--on-accent); border-radius: 5px;
  padding: 2px 8px; font-size: 11px; font-weight: 700; letter-spacing: .3px;
}
.course-year { font-size: 11px; color: var(--text2); }
.course-name { font-family: var(--serif); font-size: 16px; font-weight: 600; line-height: 1.3; }
.course-count { font-size: 11px; color: var(--text2); margin-top: 4px; }

.course-heading {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  padding-bottom: 12px; border-bottom: 2px solid var(--accent);
}
.course-heading-name { font-family: var(--serif); font-size: 22px; font-weight: 600; }
.course-heading-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

.home-section { margin-bottom: 28px; }
.home-section h3 { font-size: 14px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
.quick-letters { display: flex; flex-wrap: wrap; gap: 6px; }
.quick-letter {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px;
  transition: all .15s; display: flex; align-items: center; gap: 8px;
}
.quick-letter:hover { border-color: var(--accent); background: var(--accent-bg); }
.quick-letter .ql-count { font-size: 11px; color: var(--text2); font-weight: 400; }

.quick-searches { display: flex; flex-wrap: wrap; gap: 8px; }
.quick-search {
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
  padding: 6px 16px; cursor: pointer; font-size: 13px; color: var(--text2);
  transition: all .15s;
}
.quick-search:hover { border-color: var(--accent); color: var(--accent2); }

/* --- Search Results (Compact/Expandable) --- */
.search-section-label {
  font-size: 12px; font-weight: 700; color: var(--accent2); text-transform: uppercase;
  letter-spacing: .5px; margin: 16px 0 10px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
}
.show-all-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
  border-radius: 6px; padding: 4px 12px; font-size: 11px; cursor: pointer; transition: all .15s;
}
.show-all-btn:hover { border-color: var(--accent); color: var(--accent2); }

.compact-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 6px; transition: border-color .15s; cursor: pointer;
  overflow: hidden; box-shadow: var(--shadow);
}
.compact-card:hover { border-color: var(--accent); }
.compact-card.expanded { border-color: var(--accent); }
.compact-header {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px;
}
.compact-letter {
  background: var(--accent); color: var(--on-accent); width: 24px; height: 24px;
  border-radius: 5px; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.compact-name { font-family: var(--serif); font-size: 15px; font-weight: 600; flex: 1; }
.compact-desc { font-size: 12px; color: var(--text2); margin-top: 2px; font-weight: 400; }
.compact-meta { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.compact-count {
  background: var(--surface2); border-radius: 4px; padding: 2px 7px;
  font-size: 10px; color: var(--text2);
}
.compact-sources { display: flex; gap: 3px; }
.compact-arrow {
  color: var(--text2); font-size: 12px; transition: transform .2s; margin-left: 4px;
}
.compact-card.expanded .compact-arrow { transform: rotate(90deg); }
.compact-body {
  max-height: 0; overflow: hidden; transition: max-height .3s ease;
}
.compact-card.expanded .compact-body { max-height: 2000px; }
.compact-body-inner {
  padding: 0 16px 14px 16px; border-top: 1px solid var(--border);
}
.compact-original {
  margin-top: 8px; padding: 8px 12px; background: var(--surface2); border-radius: 6px;
  font-size: 11px; color: var(--text2); white-space: pre-wrap; display: none; line-height: 1.5;
}
.compact-original.show { display: block; }
.toggle-original {
  background: none; border: none; color: var(--text2); cursor: pointer;
  font-size: 10px; padding: 4px 0; margin-top: 6px; text-decoration: underline;
  transition: color .15s;
}
.toggle-original:hover { color: var(--accent2); }

/* --- Full Cards (letter browse) --- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px; margin-bottom: 14px;
  transition: border-color .15s; box-shadow: var(--shadow);
}
.card:hover { border-color: var(--accent); }
.card-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
}
.card-letter {
  background: var(--accent); color: var(--on-accent); width: 28px; height: 28px;
  border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; flex-shrink: 0;
}
.card-condition { font-family: var(--serif); font-size: 18px; font-weight: 600; }
.card-desc { font-size: 13px; color: var(--text2); margin-top: 2px; font-weight: 400; }
.card-sources { display: flex; gap: 5px; flex-wrap: wrap; margin-left: auto; }
.source-tag {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 7px; font-size: 10px; color: var(--text2); cursor: help;
}
.bp-tag {
  background: rgba(111,90,145,.12); border: 1px solid var(--plum);
  border-radius: 4px; padding: 2px 7px; font-size: 10px; font-weight: 700;
  color: var(--plum); cursor: help; flex-shrink: 0;
}

.remedy-entry {
  margin-bottom: 8px; margin-left: 38px; background: var(--accent-bg);
  border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0;
  padding: 10px 14px; font-size: 13px; line-height: 1.55;
}
.remedy-entry:last-child { margin-bottom: 0; }
.remedy-entry.crossref {
  border-left-color: var(--amber); background: var(--amber-bg);
  font-style: italic; color: var(--text2);
}
.remedy-entry.note-line {
  border-left-color: var(--teal); background: var(--teal-bg-soft);
}

.re-row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.re-name { font-weight: 600; color: var(--text); }
.re-potency { color: var(--amber); font-weight: 600; font-size: 12px; }
.re-dose {
  background: var(--teal-bg); color: var(--teal); border-radius: 4px;
  padding: 1px 7px; font-size: 11px; font-weight: 600;
}
.re-admin { color: var(--text2); font-size: 12px; margin-top: 3px; flex-basis: 100%; }

.highlight { background: var(--hl-bg); border-radius: 2px; padding: 0 1px; }

/* --- Add to Rx button on remedy entries --- */
.remedy-entry { position: relative; padding-right: 44px; }
.add-rx-btn {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: none; border: 1px solid var(--border); color: var(--text2);
  border-radius: 6px; width: 26px; height: 26px; font-size: 16px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0;
}
.add-rx-btn:hover { border-color: var(--green); color: var(--green); background: var(--green-bg); }
.add-rx-btn.added { border-color: var(--green); color: var(--green); background: var(--green-bg2); }

/* --- Floating prescription button --- */
.rx-float {
  position: fixed; bottom: 28px; right: 28px; z-index: 100;
  background: var(--green); color: var(--on-accent); border: none; border-radius: 50px;
  padding: 12px 22px; font-size: 14px; font-weight: 700; cursor: pointer;
  display: none; align-items: center; gap: 8px; box-shadow: var(--shadow-green);
  transition: all .2s;
}
.rx-float:hover { transform: translateY(-2px); box-shadow: var(--shadow-green-hover); }
.rx-float.show { display: flex; }
.rx-badge {
  background: rgba(253,250,244,.22); color: var(--on-accent); border-radius: 20px;
  padding: 1px 8px; font-size: 12px; font-weight: 800;
}

/* --- Prescription drawer --- */
.rx-drawer {
  position: fixed; top: 0; right: 0; width: 480px; max-width: 100vw; height: 100vh;
  background: var(--surface); border-left: 1px solid var(--border);
  z-index: 200; display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .3s ease;
  box-shadow: var(--shadow-lg);
}
.rx-drawer.open { transform: translateX(0); }
.rx-drawer-header {
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.rx-drawer-header h2 { font-family: var(--serif); font-size: 20px; font-weight: 600; }
.rx-close {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
  border-radius: 8px; width: 32px; height: 32px; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.rx-close:hover { border-color: var(--rose); color: var(--rose); }
.rx-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
.rx-empty { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 14px; }
.rx-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 8px;
}
.rx-item-text { flex: 1; font-size: 13px; line-height: 1.5; }
.rx-item-condition { font-size: 10px; color: var(--text2); margin-top: 2px; }
.rx-remove {
  background: none; border: none; color: var(--text2); cursor: pointer;
  font-size: 16px; padding: 0 2px; transition: color .15s; flex-shrink: 0;
}
.rx-remove:hover { color: var(--rose); }
.rx-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.rx-preview {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px; font-size: 12px; line-height: 1.7; color: var(--text2);
  white-space: pre-wrap; max-height: 220px; overflow-y: auto; font-family: monospace;
}
.rx-copy-btn {
  background: var(--accent); color: var(--on-accent); border: none; border-radius: 8px;
  padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s;
  text-align: center;
}
.rx-copy-btn:hover { background: var(--accent2); }
.rx-copy-btn.copied { background: var(--green); color: var(--on-accent); }
.rx-clear { background: none; border: none; color: var(--text2); font-size: 12px; cursor: pointer; text-align: center; text-decoration: underline; }
.rx-clear:hover { color: var(--rose); }
.rx-overlay {
  position: fixed; inset: 0; background: var(--overlay); z-index: 199;
  display: none;
}
.rx-overlay.show { display: block; }

/* --- Reference --- */
.ref-section { margin-bottom: 32px; }
.ref-section h3 { font-family: var(--serif); font-size: 17px; font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.ref-table { width: 100%; border-collapse: collapse; }
.ref-table th, .ref-table td { text-align: left; padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
.ref-table th { color: var(--text2); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
.ref-table tr:hover td { background: var(--accent-bg); }

/* --- Bottom nav (mobile only) --- */
.bottom-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
  background: var(--surface); border-top: 1px solid var(--border);
  height: 62px; align-items: stretch;
}
.bottom-nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; background: none; border: none;
  color: var(--text2); font-size: 10px; font-weight: 600; cursor: pointer;
  padding: 8px 0; transition: color .15s; text-transform: uppercase; letter-spacing: .4px;
}
.bottom-nav-btn .bn-icon { font-size: 20px; line-height: 1; }
.bottom-nav-btn.active, .bottom-nav-btn:hover { color: var(--accent2); }
.bottom-nav-btn.rx-nav { color: var(--green); }
.bottom-nav-badge {
  background: var(--green); color: var(--on-accent); border-radius: 10px;
  padding: 1px 6px; font-size: 9px; font-weight: 800; margin-left: 2px;
}

/* --- Letter drawer (mobile) --- */
.letter-drawer {
  display: none; position: fixed; bottom: 62px; left: 0; right: 0; z-index: 89;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 14px; transform: translateY(100%); transition: transform .25s ease;
}
.letter-drawer.open { transform: translateY(0); }
.letter-drawer-grid {
  display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px;
}
.letter-drawer .letter-btn { padding: 8px 0; font-size: 14px; }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .bottom-nav { display: flex; }
  .letter-drawer { display: block; }
  .rx-float { display: none !important; } /* replaced by bottom nav */

  .app { flex-direction: column; }
  .main { padding-bottom: 62px; } /* space for bottom nav */

  .course-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .course-card { padding: 11px; }
  .course-name { font-size: 14px; }
  .course-heading-name { font-size: 18px; }

  .home-btn { display: flex !important; }

<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header" id="homeBtn">

</div>

  </button>
</nav>

  <div class="letter-drawer-grid" id="mobileLetterGrid"></div>

<script>
let DATA = null;
let activeLetter = null;
let activeTab = 'conditions';
let currentView = 'home';

// --- Prescription cart ---
let rxItems = []; // [{text, condition, raw}]

function rxInit() {
  document.getElementById('rxFloat').addEventListener('click', rxOpen);
  document.getElementById('rxClose').addEventListener('click', rxClose);
  document.getElementById('rxOverlay').addEventListener('click', rxClose);
  document.getElementById('rxCopyBtn').addEventListener('click', rxCopy);
  document.getElementById('rxClearBtn').addEventListener('click', () => { rxItems = []; rxRefresh(); rxClose(); });
}

function rxOpen() { document.getElementById('rxDrawer').classList.add('open'); document.getElementById('rxOverlay').classList.add('show'); rxRefresh(); }
function rxClose() { document.getElementById('rxDrawer').classList.remove('open'); document.getElementById('rxOverlay').classList.remove('show'); }

function rxAdd(text, condition) {
  const key = text + '||' + condition;
  if (rxItems.find(r => r.key === key)) return;
  rxItems.push({ key, text, condition });
  rxRefreshFloat();
}

function rxRemove(key) {
  rxItems = rxItems.filter(r => r.key !== key);
  rxRefresh();
  rxRefreshFloat();
}

function rxRefreshFloat() {
  const btn = document.getElementById('rxFloat');
  const badge = document.getElementById('rxBadge');
  badge.textContent = rxItems.length;
  btn.classList.toggle('show', rxItems.length > 0);
  // mobile bottom nav badge
  const bnBadge = document.getElementById('bnBadge');
  if (bnBadge) { bnBadge.textContent = rxItems.length; bnBadge.style.display = rxItems.length > 0 ? '' : 'none'; }
  // update add buttons' state
  document.querySelectorAll('.add-rx-btn').forEach(b => {
    b.classList.toggle('added', rxItems.some(r => r.key === b.dataset.key));
    b.textContent = rxItems.some(r => r.key === b.dataset.key) ? '✓' : '+';
  });
}

function rxRefresh() {
  const body = document.getElementById('rxBody');
  const preview = document.getElementById('rxPreview');
  if (!rxItems.length) {
    body.innerHTML = `<div class="rx-empty">No remedies selected yet.<br>Hit <strong>+</strong> on any remedy to add it here.</div>`;
    preview.textContent = '';
    return;
  }
  body.innerHTML = rxItems.map(r => `
    <div class="rx-item">
      <div class="rx-item-text">
        <div>${r.text}</div>
        <div class="rx-item-condition">For: ${r.condition}</div>
      </div>
      <button class="rx-remove" data-key="${escAttr(r.key)}">&times;</button>
    </div>`).join('');
  body.querySelectorAll('.rx-remove').forEach(btn => {
    btn.addEventListener('click', () => rxRemove(btn.dataset.key));
  });
  preview.textContent = rxBuildText();
}

function plainEnglish(text) {
  return text
    // Remove [BP], [BPA], [BPH] etc tags
    .replace(/\[BP[A-Z]*\]\s*/gi, '')
    // Frequency shorthand → plain words
    .replace(/\be(\d+)H\b/gi, (_, n) => `every ${n} hours`)
    .replace(/\beH\b/gi, 'every hour')
    .replace(/\be(\d+)D\b/gi, (_, n) => `every ${n} days`)
    .replace(/\beoD\b/gi, 'every other day')
    .replace(/\b1D\b/g, 'once daily')
    .replace(/\b2D\b/g, 'twice daily')
    .replace(/\b3D\b/g, '3 times daily')
    .replace(/\b(\d+)D\b/g, (_, n) => `${n} times daily`)
    .replace(/\bSOS\b/g, 'as needed')
    .replace(/\buntil VMB\b/gi, 'until much better')
    .replace(/\bVMB\b/gi, 'much better')
    .replace(/\be(\d+)min\b/gi, (_, n) => `every ${n} minutes`)
    // Separator # → +
    .replace(/\s*#\s*/g, ' + ')
    // Clean up extra spaces/parens left behind
    .replace(/\(\s*\)/g, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function rxBuildText() {
  const date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  let txt = `FOURFOLD HOMEOPATHY\n`;
  txt += `${'─'.repeat(44)}\n`;
  txt += `Date: ${date}\n\n`;

  // Group by condition
  const groups = {};
  rxItems.forEach(r => {
    if (!groups[r.condition]) groups[r.condition] = [];
    groups[r.condition].push(plainEnglish(r.text));
  });
  Object.entries(groups).forEach(([cond, items]) => {
    txt += `FOR: ${cond}\n`;
    items.forEach(item => { txt += `  • ${item}\n`; });
    txt += '\n';
  });

  txt += `${'─'.repeat(44)}`;
  return txt;
}

function rxCopy() {
  const text = rxBuildText();
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('rxCopyBtn');
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy to Clipboard'; btn.classList.remove('copied'); }, 2000);
  });
}

fetch('remedies_data.json').then(r => r.json()).then(d => { DATA = d; init(); });

function init() {
  rxInit();
  buildCourses();
  buildLetterGrid();
  document.getElementById('homeBtn').addEventListener('click', goHome);
  document.getElementById('homeTopBtn').addEventListener('click', goHome);
  document.querySelectorAll('.nav-tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  const input = document.getElementById('searchInput');
  input.addEventListener('input', debounce(onSearch, 140));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { onSearchEnter(e); }
    if (e.key === 'Escape') { input.value = ''; activeTerms = []; goHome(); }
  });
  document.getElementById('searchClear').addEventListener('click', () => { input.value = ''; activeTerms = []; goHome(); input.focus(); });
  goHome();
}

function setHomeBtn(visible) {
  document.getElementById('homeTopBtn').classList.toggle('show', visible);
}

// Show the home view without touching what the user has typed.
function showHomeContent() {
  currentView = 'home';
  activeLetter = null;
  document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('resultCount').textContent = '';
  document.getElementById('sidebarList').innerHTML = '';
  document.getElementById('chipsBar').innerHTML = '';
  setHomeBtn(false);
  renderHome();
}

function goHome() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  activeTerms = [];
  showHomeContent();
}

function buildLetterGrid() {
  const grid = document.getElementById('letterGrid');
  const mobileGrid = document.getElementById('mobileLetterGrid');
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const hasData = new Set(DATA.remedies.map(r => r.letter));
  const btnHtml = letters.map(l =>
    `<div class="letter-btn ${hasData.has(l) ? '' : 'empty'}" data-letter="${l}">${l}</div>`
  ).join('');
  grid.innerHTML = btnHtml;
  if (mobileGrid) mobileGrid.innerHTML = btnHtml;
  grid.addEventListener('click', handleLetterClick);
  if (mobileGrid) mobileGrid.addEventListener('click', e => { handleLetterClick(e); closeMobileLetterDrawer(); });
}

function handleLetterClick(e) {
  const btn = e.target.closest('.letter-btn');
  if (!btn || btn.classList.contains('empty')) return;
  if (activeLetter === btn.dataset.letter) { goHome(); return; }
  selectLetter(btn.dataset.letter);
}

function toggleMobileLetterDrawer() {
  const drawer = document.getElementById('mobileLetterDrawer');
  if (drawer) drawer.classList.toggle('open');
}

function closeMobileLetterDrawer() {
  const drawer = document.getElementById('mobileLetterDrawer');
  if (drawer) drawer.classList.remove('open');
}

function toggleRxDrawer() {
  const drawer = document.getElementById('rxDrawer');
  if (drawer && drawer.classList.contains('open')) rxClose(); else rxOpen();
}

function selectLetter(letter) {
  activeLetter = letter;
  currentView = 'letter';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  document.querySelectorAll('.letter-btn').forEach(b => b.classList.toggle('active', b.dataset.letter === letter));
  activeTab = 'conditions';
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'conditions'));
  setHomeBtn(true);
  showConditionsForLetter(letter);
}

function selectCourse(code) {
  const course = COURSES.find(c => c.code === code);
  if (!course) return;
  activeLetter = null;
  activeTerms = [];
  currentView = 'course';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  document.getElementById('chipsBar').innerHTML = '';
  document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
  activeTab = 'conditions';
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'conditions'));
  setHomeBtn(true);
  closeMobileLetterDrawer();

  const items = remediesForCourse(code);
  const list = document.getElementById('sidebarList');
  list.innerHTML = items.map((item, i) => {
    const p = parseConditionName(item.condition);
    return `<div class="sidebar-item" data-idx="${i}"><span>${escHtml(truncate(p.name, 32))}</span><span class="tag">${item.remedies.length}</span></div>`;
  }).join('');
  list.querySelectorAll('.sidebar-item').forEach(el => {
    el.addEventListener('click', () => {
      list.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      renderCards([items[+el.dataset.idx]], '', courseHeading(course));
      document.getElementById('content').scrollTop = 0;
    });
  });

  renderCards(items, '', courseHeading(course));
  document.getElementById('content').scrollTop = 0;
}

function courseHeading(course) {
  return `<div class="course-heading">
    <span class="course-code">${course.code}</span>
    <div>
      <div class="course-heading-name">${escHtml(course.name)}</div>
      <div class="course-heading-sub">${course.count.toLocaleString()} conditions${course.date ? ` &middot; published ${course.date}` : ''}</div>
    </div>
  </div>`;
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'reference') showReference();
  else if (activeLetter) showConditionsForLetter(activeLetter);
  else goHome();
}

// --- Condition Name Parsing ---
function parseConditionName(raw) {
  let name = raw, desc = '';
  const dashIdx = raw.indexOf(' - ');
  const parenIdx = raw.indexOf('(');
  if (dashIdx > 0 && (parenIdx < 0 || dashIdx < parenIdx)) {
    name = raw.substring(0, dashIdx).trim();
    desc = raw.substring(dashIdx + 3).trim();
  } else if (parenIdx > 0 && raw.endsWith(')')) {
    name = raw.substring(0, parenIdx).trim();
    desc = raw.substring(parenIdx + 1, raw.length - 1).trim();
  } else if (parenIdx > 0) {
    const closeIdx = raw.indexOf(')', parenIdx);
    if (closeIdx > parenIdx && closeIdx === raw.length - 1) {
      name = raw.substring(0, parenIdx).trim();
      desc = raw.substring(parenIdx + 1, closeIdx).trim();
    }
  }
  name = name.replace(/[,\s]+$/, '');
  return { name, desc, original: raw };
}

// --- Remedy Parsing ---
function parseRemedy(text) {
  const t = text.trim();
  if (/^see\s/i.test(t) || /^also\s*see/i.test(t)) return { type: 'crossref', text: t };
  if (/^(if |also |note|for |when |do not|continue|add |important|symptoms|the |this |after |before |during |\d+\.\s)/i.test(t) && !/\d+[cxCX]\b/.test(t))
    return { type: 'note', text: t };

  const potencyRe = /\b(\d+[cxCX](?:\b|,)|(?:MT|CM|\d+M)\b|\d+CK\b)/;
  let name = '', potency = '', dose = '', admin = '';
  const pm = t.match(potencyRe);
  if (pm) {
    const idx = t.indexOf(pm[0]);
    name = t.substring(0, idx).replace(/[\s,]+$/, '').trim();
    const rest = t.substring(idx);
    potency = pm[0];
    const afterPotency = rest.substring(pm[0].length).trim().replace(/^[,\s]+/, '');
    const doses = [];
    const doseRe2 = /\b(e?\d*[HD]|eH|eoD|SOS|e\d+H|e\d+D|\d+D|\d+H|e\d+min|until VMB|as needed)\b/gi;
    let dm;
    while ((dm = doseRe2.exec(afterPotency)) !== null) doses.push(dm[0]);
    dose = doses.join(', ');
    admin = afterPotency;
    for (const d of doses) admin = admin.replace(d, '').trim();
    admin = admin.replace(/^[,.\s]+|[,.\s]+$/g, '').trim();
  } else {
    name = t;
  }
  if (!name && !potency) return { type: 'note', text: t };
  return { type: 'remedy', name, potency, dose, admin: admin || '' };
}

function renderParsedRemedy(parsed, query, condition) {
  if (parsed.type === 'crossref')
    return `<div class="remedy-entry crossref">${hl(parsed.text, query)}</div>`;
  if (parsed.type === 'note')
    return `<div class="remedy-entry note-line">${hl(parsed.text, query)}</div>`;

  // Build plain text for cart
  const plainText = [parsed.name, parsed.potency, parsed.dose ? `(${parsed.dose})` : '', parsed.admin].filter(Boolean).join(' ');
  const key = escAttr(plainText + '||' + (condition || ''));
  const isAdded = rxItems.some(r => r.key === (plainText + '||' + (condition || '')));

  let html = `<div class="remedy-entry"><div class="re-row">`;
  if (parsed.name) html += `<span class="re-name">${hl(parsed.name, query)}</span>`;
  if (parsed.potency) html += `<span class="re-potency">${hl(parsed.potency, query)}</span>`;
  if (parsed.dose) html += `<span class="re-dose">${parsed.dose}</span>`;
  html += '</div>';
  if (parsed.admin) html += `<div class="re-admin">${hl(parsed.admin, query)}</div>`;
  if (condition !== undefined) {
    html += `<button class="add-rx-btn ${isAdded ? 'added' : ''}" data-key="${key}" data-text="${escAttr(plainText)}" data-condition="${escAttr(condition || '')}">${isAdded ? '✓' : '+'}</button>`;
  }
  html += '</div>';
  return html;
}

function getRemedyLines(item) {
  const lines = [];
  for (const r of item.remedies) {
    for (const sl of r.split('\n').filter(s => s.trim())) lines.push(sl);
  }
  return lines;
}

// --- Courses (the source books/courses each entry came from) ---
// A few courses are recorded under more than one code in the data.
const COURSE_ALIASES = { F: ['FEM'], G2: ['GW2'] };
let COURSES = [];

// Source strings are comma-joined and sometimes spaced ("BP A" for BPA),
// so match the code's characters allowing whitespace between them.
function courseRegex(code) {
  const chars = code.split('').map(c => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  return new RegExp('\\b' + chars.join('\\s*') + '\\b', 'i');
}

function entryInCourse(item, res) {
  return item.sources.some(s => res.some(re => re.test(s)));
}

// Courses are the abbreviations that actually appear as a source on some entry;
// the dosing notation in the same table (eod, PRN, "+") never does.
function buildCourses() {
  COURSES = [];
  for (const [code, meta] of Object.entries(DATA.abbreviations)) {
    if (!/^[A-Za-z0-9]+$/.test(code)) continue;
    const res = [code].concat(COURSE_ALIASES[code] || []).map(courseRegex);
    const count = DATA.remedies.reduce((n, r) => n + (entryInCourse(r, res) ? 1 : 0), 0);
    if (count) COURSES.push({ code, name: meta.name, date: meta.date, count, res });
  }
}

function remediesForCourse(code) {
  const c = COURSES.find(x => x.code === code);
  return c ? DATA.remedies.filter(r => entryInCourse(r, c.res)) : [];
}

// --- Banerji Protocols (BPH / BPA / BPO sources, or [BP] marked lines) ---
const BANERJI_SRC_RE = /\bBP\s*[HAO]?\b/i;
function isBanerji(item) {
  return item.sources.some(s => BANERJI_SRC_RE.test(s)) ||
         item.remedies.some(r => r.includes('[BP]'));
}

// --- Search Relevance Scoring ---
function scoreResult(item, ql) {
  let score = 0;
  const cond = item.condition.toLowerCase();
  const allRemedyText = item.remedies.join(' ');

  // --- Condition name match (most important) ---
  if (cond === ql) score += 100;
  else if (cond.startsWith(ql + ' ') || cond.startsWith(ql + ',')) score += 85;
  else if (cond.includes(ql)) score += 60;
  else if (item.remedies.some(r => r.toLowerCase().includes(ql))) score += 20;

  // --- Generality: shorter condition names = more general ---
  const condWords = cond.split(/[\s,\-()]+/).filter(Boolean);
  if (condWords.length === 1) score += 20;
  else if (condWords.length === 2) score += 12;
  else if (condWords.length <= 4) score += 5;
  // penalize very long/specific condition names
  if (condWords.length > 8) score -= 15;

  // --- Has dose info (e.g. 30c, 6x, 200c) = actionable ---
  const hasDose = /\b\d+[cxCX]\b/.test(allRemedyText);
  if (hasDose) score += 18;

  // --- Has frequency info (e.g. 2D, eH, SOS) = more complete ---
  const hasFreq = /\b(e?\d+[HD]|eH|eoD|SOS|e\d+H)\b/.test(allRemedyText);
  if (hasFreq) score += 8;

  // --- More remedy options = richer entry ---
  if (item.remedies.length >= 3) score += 6;
  else if (item.remedies.length >= 2) score += 3;

  // --- Banerji Protocols outrank equally-relevant entries ---
  if (isBanerji(item)) score += 50;

  // --- Penalize "see X" cross-reference only entries ---
  const isOnlyCrossRef = item.remedies.every(r => /^see\s/i.test(r.trim()));
  if (isOnlyCrossRef) score -= 30;

  return score;
}

// Matching entries for a lowercased query.
function findMatches(ql) {
  return DATA.remedies.filter(r =>
    r.condition.toLowerCase().includes(ql) ||
    r.remedies.some(rem => rem.toLowerCase().includes(ql))
  );
}

// Wire expand/collapse, original-text toggles and Rx buttons within a subtree.
function wireCards(root) {
  root.querySelectorAll('.compact-card').forEach(card => {
    card.querySelector('.compact-header').addEventListener('click', () => {
      card.classList.toggle('expanded');
    });
  });
  root.querySelectorAll('.toggle-original').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const orig = btn.nextElementSibling;
      const showing = orig.classList.contains('show');
      orig.classList.toggle('show');
      btn.textContent = showing ? 'Show original text' : 'Hide original text';
    });
  });
  wireRxButtons(root);
}

// "Show All" builds its cards on first click rather than up front, so typing
// only ever renders the 5 visible cards.
function wireLazyShowAll(btn, container, scoredRest, query, idPrefix, limit) {
  btn.addEventListener('click', () => {
    if (!container.dataset.filled) {
      let html = scoredRest.slice(0, limit)
        .map((s, i) => renderCompactCard(s.item, query, `${idPrefix}-${i}`)).join('');
      if (scoredRest.length > limit) {
        html += `<div style="text-align:center;padding:16px;color:var(--text2);font-size:13px;">
          + ${scoredRest.length - limit} more results. Refine your search for better matches.</div>`;
      }
      container.innerHTML = html;
      container.dataset.filled = '1';
      wireCards(container);
    }
    const showing = container.style.display !== 'none';
    container.style.display = showing ? 'none' : 'block';
    btn.textContent = showing ? 'Show All' : 'Hide';
  });
}

// --- Search Results (Compact) ---
function renderSearchResults(results, query) {
  const inner = document.getElementById('contentInner');
  const ql = query.toLowerCase();

  const scored = results.map(r => ({ item: r, score: scoreResult(r, ql) }));
  scored.sort((a, b) => b.score - a.score);

  const top = scored.slice(0, 5);
  const rest = scored.slice(5);

  let html = '';
  if (top.length) {
    html += `<div class="search-section-label">&#11088; Most Common (${top.length} recommended)</div>`;
    html += top.map((s, i) => renderCompactCard(s.item, query, `top-${i}`)).join('');
  }
  if (rest.length) {
    html += `<div class="search-section-label">More Specific Results (${rest.length})
      <button class="show-all-btn" id="showAllBtn">Show All</button></div>`;
    html += `<div id="restResults" style="display:none;"></div>`;
  }

  inner.innerHTML = html;
  document.getElementById('resultCount').textContent = `${results.length} result${results.length !== 1 ? 's' : ''}`;

  wireCards(inner);

  const showAllBtn = document.getElementById('showAllBtn');
  if (showAllBtn) {
    wireLazyShowAll(showAllBtn, document.getElementById('restResults'), rest, query, 'rest', 100);
  }
}

function renderCompactCard(item, query, id) {
  const parsed = parseConditionName(item.condition);
  const lines = getRemedyLines(item);
  const originalText = item.remedies.join('\n');
  // Banerji sources first, so they survive the 2-tag limit below
  const sources = item.sources.slice().sort((a, b) =>
    (BANERJI_SRC_RE.test(b) ? 1 : 0) - (BANERJI_SRC_RE.test(a) ? 1 : 0));

  return `
  <div class="compact-card" data-id="${id}">
    <div class="compact-header">
      <span class="compact-letter">${item.letter}</span>
      <div style="flex:1;min-width:0;">
        <div class="compact-name">${hl(parsed.name, query)}</div>
        ${parsed.desc ? `<div class="compact-desc">${hl(parsed.desc, query)}</div>` : ''}
      </div>
      <div class="compact-meta">
        ${isBanerji(item) ? `<span class="bp-tag" title="Banerji Protocol">BP</span>` : ''}
        ${sources.length ? `<div class="compact-sources">${sources.slice(0,2).map(s =>
          `<span class="source-tag" title="${escAttr(getAbbrevTitle(s))}">${s}</span>`).join('')}</div>` : ''}
        <span class="compact-count">${lines.length} remedy${lines.length !== 1 ? 's' : ''}</span>
        <span class="compact-arrow">&#9654;</span>
      </div>
    </div>
    <div class="compact-body">
      <div class="compact-body-inner">
        ${lines.map(r => renderParsedRemedy(parseRemedy(r), query, parsed.name)).join('')}
        <button class="toggle-original">Show original text</button>
        <div class="compact-original">${escHtml(originalText)}</div>
      </div>
    </div>
  </div>`;
}

// --- Full Cards (letter / course browse) ---
function buildCard(item, query) {
  const parsed = parseConditionName(item.condition);
  const lines = getRemedyLines(item);
  return `
  <div class="card">
    <div class="card-header">
      <span class="card-letter">${item.letter}</span>
      <div>
        <div class="card-condition">${hl(parsed.name, query)}</div>
        ${parsed.desc ? `<div class="card-desc">${hl(parsed.desc, query)}</div>` : ''}
      </div>
      ${item.sources.length ? `<div class="card-sources">${item.sources.map(s =>
        `<span class="source-tag" title="${escAttr(getAbbrevTitle(s))}">${s}</span>`).join('')}</div>` : ''}
    </div>
    ${lines.map(r => renderParsedRemedy(parseRemedy(r), query, parsed.name)).join('')}
  </div>`;
}

function renderCards(items, query, heading) {
  const inner = document.getElementById('contentInner');
  document.getElementById('resultCount').textContent = `${items.length} condition${items.length !== 1 ? 's' : ''}`;
  const head = heading || '';

  let html = head + items.slice(0, 50).map(item => buildCard(item, query)).join('');
  if (items.length > 50) {
    html += `<div style="text-align:center;padding:20px;">
      <button id="loadMoreBtn" style="background:var(--accent);color:var(--on-accent);border:none;border-radius:8px;padding:10px 28px;cursor:pointer;font-size:14px;font-weight:600;">
        Show More (${items.length - 50} remaining)
      </button></div>`;
  }
  inner.innerHTML = html;
  wireRxButtons(inner);
  if (items.length > 50) {
    document.getElementById('loadMoreBtn').addEventListener('click', () => {
      inner.innerHTML = head + items.map(item => buildCard(item, query)).join('');
      wireRxButtons(inner);
    });
  }
}

function showConditionsForLetter(letter) {
  const items = DATA.remedies.filter(r => r.letter === letter);
  const list = document.getElementById('sidebarList');
  list.innerHTML = items.map((item, i) => {
    const p = parseConditionName(item.condition);
    return `<div class="sidebar-item" data-idx="${i}"><span>${truncate(p.name, 32)}</span><span class="tag">${item.remedies.length}</span></div>`;
  }).join('');
  list.querySelectorAll('.sidebar-item').forEach(el => {
    el.addEventListener('click', () => {
      list.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      renderCards([items[+el.dataset.idx]]);
      document.getElementById('content').scrollTop = 0;
    });
  });
  renderCards(items);
}

  document.getElementById('contentInner').innerHTML = `

      <div class="home-section">
        <h3>Common Searches</h3>

          ${['Headache','Fever','Cough','Anxiety','Pain','Insomnia','Nausea','Allergy','Skin','Infection','Burns','Flu'].map(s =>
            `<div class="quick-search" data-q="${s}">${s}</div>`).join('')}
        </div>
      </div>
      <div class="home-section">
        <h3>Reference Guides</h3>
        <div class="quick-searches">
          <div class="quick-search" data-ref="abbr">Abbreviation Guide</div>
          <div class="quick-search" data-ref="pot">Potencies</div>
          <div class="quick-search" data-ref="cs">Cell Salt Combinations</div>
        </div>
      </div>
      <div class="home-section">
        <h3 class="collapse-toggle" id="coursesToggle" role="button" tabindex="0"
            aria-expanded="false" aria-controls="courseGrid">
          <span class="collapse-arrow">&#9654;</span>
          Browse by Course
          <span class="collapse-hint">${COURSES.length} courses</span>
        </h3>
        <div class="course-grid" id="courseGrid" hidden>
          ${COURSES.map(c => `
            <div class="course-card" data-course="${escAttr(c.code)}">
              <div class="course-card-top">
                <span class="course-code">${c.code}</span>
                ${c.date ? `<span class="course-year">${c.date}</span>` : ''}
              </div>
              <div class="course-name">${escHtml(c.name)}</div>
              <div class="course-count">${c.count.toLocaleString()} conditions</div>
            </div>`).join('')}
        </div>

    </div>`;

  });
  document.querySelectorAll('.quick-search[data-q]').forEach(el => {

// --- Search (top priority) ---
// --- Multi-symptom state ---
let activeTerms = []; // [{text, on}]

// Turn whatever is in the search box into active terms and run the search.
// Shared by Enter, the comma shortcut, and the quick-search chips.
function commitSearchInput() {
  const raw = document.getElementById('searchInput').value.trim();
  if (!raw) return;
  raw.split(',').map(s => s.trim()).filter(Boolean).forEach(p => {
    if (!activeTerms.find(t => t.text.toLowerCase() === p.toLowerCase())) {
      activeTerms.push({ text: p, on: true });
    }
  });
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  runMultiSearch();
}

const LIVE_MIN_CHARS = 2; // 1 char matches most of the book — not worth rendering

// Runs on every keystroke (debounced).
function onSearch() {
  const raw = document.getElementById('searchInput').value;
  const q = raw.trim();
  document.getElementById('searchClear').classList.toggle('show', q.length > 0);

  // A comma means the user finished a term — commit it as a chip.
  if (raw.includes(',')) { commitSearchInput(); return; }

  // Otherwise preview results for what's been typed so far.
  if (q.length >= LIVE_MIN_CHARS) {
    livePreview(q);
  } else if (activeTerms.filter(t => t.on).length) {
    runMultiSearch();          // fall back to the committed symptoms
  } else if (currentView !== 'home') {
    showHomeContent();
  }
}

function livePreview(q) {
  // With symptoms already pinned, show the draft as an extra group alongside them.
  if (activeTerms.filter(t => t.on).length) { runMultiSearch(q); return; }

  activeLetter = null;
  currentView = 'search';
  setHomeBtn(true);
  document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('chipsBar').innerHTML = '';
  document.getElementById('sidebarList').innerHTML = '';

  const results = findMatches(q.toLowerCase());
  if (!results.length) {
    document.getElementById('contentInner').innerHTML =
      `<div style="text-align:center;padding:60px 20px;color:var(--text2);font-size:14px">
         No results for &ldquo;${escHtml(q)}&rdquo;.</div>`;
    document.getElementById('resultCount').textContent = '0 results';
    return;
  }
  renderSearchResults(results, q);
}

function onSearchEnter(e) {
  if (e.key !== 'Enter') return;
  commitSearchInput();
}

function renderChips() {
  const bar = document.getElementById('chipsBar');
  if (!activeTerms.length) { bar.innerHTML = ''; return; }
  bar.innerHTML = activeTerms.map((t, i) => `
    <div class="chip ${t.on ? '' : 'off'}" data-idx="${i}">
      ${t.text}
      <span class="chip-x" data-remove="${i}">&times;</span>
    </div>`).join('');

  bar.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', e => {
      if (e.target.dataset.remove !== undefined) {
        activeTerms.splice(+e.target.dataset.remove, 1);
      } else {
        activeTerms[+chip.dataset.idx].on = !activeTerms[+chip.dataset.idx].on;
      }
      if (!activeTerms.length) { goHome(); return; }
      runMultiSearch();
    });
  });
}

// `draft` is text still being typed — shown as a provisional group but not yet a chip.
function runMultiSearch(draft) {
  activeLetter = null;
  currentView = 'search';
  setHomeBtn(true);
  document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
  renderChips();

  const onTerms = activeTerms.filter(t => t.on)
    .concat(draft ? [{ text: draft, on: true, draft: true }] : []);
  if (!onTerms.length) {
    document.getElementById('contentInner').innerHTML = `<div style="text-align:center;padding:60px;color:var(--text2)">All symptoms toggled off — turn one back on to see results.</div>`;
    document.getElementById('resultCount').textContent = '';
    document.getElementById('sidebarList').innerHTML = '';
    return;
  }

  const inner = document.getElementById('contentInner');
  let allHtml = '';
  let totalCount = 0;

  const pending = []; // rest-lists to wire up after innerHTML lands

  onTerms.forEach((term, gi) => {
    const ql = term.text.toLowerCase();
    const results = findMatches(ql);
    const scored = results.map(r => ({ item: r, score: scoreResult(r, ql) }));
    scored.sort((a, b) => b.score - a.score);
    totalCount += results.length;

    const top = scored.slice(0, 5);
    const rest = scored.slice(5);

    allHtml += `<div class="symptom-group" data-term="${escAttr(term.text)}">`;
    allHtml += `<div class="symptom-group-label">
      <span class="symptom-chip-inline${term.draft ? ' draft' : ''}">${escHtml(term.text)}</span>
      <span style="color:var(--text2);font-size:11px">${results.length} result${results.length !== 1 ? 's' : ''}${
        term.draft ? ' &middot; press Enter to keep' : ''}</span>
    </div>`;

    if (!results.length) {
      allHtml += `<div style="padding:12px 0;color:var(--text2);font-size:13px">No results found for "${escHtml(term.text)}".</div>`;
    } else {
      allHtml += top.map((s, i) => renderCompactCard(s.item, term.text, `g${gi}-top-${i}`)).join('');
      if (rest.length) {
        allHtml += `<div class="search-section-label" style="margin-top:8px">
          More Specific Results (${rest.length})
          <button class="show-all-btn" data-target="rest-g${gi}">Show All</button>
        </div>`;
        allHtml += `<div id="rest-g${gi}" style="display:none"></div>`;
        pending.push({ gi, rest, text: term.text });
      }
    }
    allHtml += `</div>`;
  });

  inner.innerHTML = allHtml;
  document.getElementById('resultCount').textContent = `${onTerms.length} symptom${onTerms.length !== 1 ? 's' : ''}`;

  wireCards(inner);
  pending.forEach(p => {
    const btn = inner.querySelector(`.show-all-btn[data-target="rest-g${p.gi}"]`);
    const container = document.getElementById(`rest-g${p.gi}`);
    if (btn && container) wireLazyShowAll(btn, container, p.rest, p.text, `g${p.gi}-rest`, 80);
  });

  document.getElementById('sidebarList').innerHTML = '';
}

// --- Reference ---
function showReference() {
  setHomeBtn(true);
  const list = document.getElementById('sidebarList');
  list.innerHTML = ['Abbreviations','Potencies','Cell Salts'].map(s =>
    `<div class="sidebar-item" data-ref="${s}"><span>${s}</span></div>`
  ).join('');
  list.querySelectorAll('.sidebar-item').forEach(el => {
    el.addEventListener('click', () => {
      list.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      renderReference(el.dataset.ref);
    });
  });
  renderAllReference();
}
function renderAllReference() {
  document.getElementById('contentInner').innerHTML = buildAbbrTable() + buildPotencyTable() + buildCellSaltTable();
  document.getElementById('resultCount').textContent = 'Reference';
}
function renderReference(ref) {
  const inner = document.getElementById('contentInner');
  if (ref === 'Abbreviations') inner.innerHTML = buildAbbrTable();
  else if (ref === 'Potencies') inner.innerHTML = buildPotencyTable();
  else inner.innerHTML = buildCellSaltTable();
  document.getElementById('resultCount').textContent = ref;
}
function buildAbbrTable() {
  const rows = Object.entries(DATA.abbreviations).map(([k,v]) =>
    `<tr><td><strong>${k}</strong></td><td>${v.name}</td><td>${v.date}</td></tr>`).join('');
  return `<div class="ref-section"><h3>Abbreviation Guide</h3>
    <table class="ref-table"><thead><tr><th>Code</th><th>Course</th><th>Published</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function buildPotencyTable() {
  const rows = DATA.potencies.map(p =>
    `<tr><td><strong>${p.label}</strong></td><td>${p.description}</td></tr>`).join('');
  return `<div class="ref-section"><h3>Potencies</h3>
    <table class="ref-table"><thead><tr><th>Type</th><th>Description</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function buildCellSaltTable() {
  const rows = DATA.cell_salts.map(c =>
    `<tr><td>${c.number}</td><td><strong>${c.condition}</strong></td><td>${c.combinations}</td><td>${c.indications}</td></tr>`).join('');
  return `<div class="ref-section"><h3>Cell Salt Combinations</h3>
    <table class="ref-table"><thead><tr><th>#</th><th>Condition</th><th>Combinations</th><th>Indications</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// --- Rx button wiring ---
function wireRxButtons(container) {
  container.querySelectorAll('.add-rx-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const key = btn.dataset.key;
      const text = btn.dataset.text;
      const condition = btn.dataset.condition;
      if (rxItems.some(r => r.key === key)) {
        rxItems = rxItems.filter(r => r.key !== key);
      } else {
        rxItems.push({ key, text, condition });
      }
      rxRefreshFloat();
    });
  });
}

// --- Helpers ---
function getAbbrevTitle(code) {
  return code.split(/[,\s]+/).map(p => {
    const a = DATA.abbreviations[p.trim()];
    return a ? `${p.trim()}: ${a.name}` : p.trim();
  }).join(', ');
}
function hl(text, query) {
  if (!query) return text;
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<span class="highlight">$1</span>');
}
function escAttr(s) { return s.replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function truncate(s, n) { return s.length > n ? s.substring(0, n) + '…' : s; }
function debounce(fn, ms) { let t; return function(...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); }; }
